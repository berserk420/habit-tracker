<style>
/* Layout: one-screen phone app. Sticky ink header, scrolling paper body, fixed tab bar. Teal "panel" for the day's score, like Ellipsus's app chrome. */
:root {
  --paper: #F2F2EF; --card: #FBFBF9; --ink: #282825; --muted: #76766E; --line: #E2E2DD;
  --panel: #1F4A4F; --panel-ink: #EEF4F3; --panel-muted: #A9C2C0;
  --lav: #2173BE; --lav-soft: #E3EEF8; --green: #3B8556; --green-soft: #E1EFE5;
  --coral: #D2443E; --coral-soft: #F9DEDC; --orange: #E0822F; --orange-soft: #FBEBDC;
  --head: #282825; --head-ink: #FBFBF9;
  --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --sans: "Manrope", "Segoe UI", system-ui, sans-serif;
  --r-lg: 20px; --r-md: 14px; --r-sm: 9px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1B1B19; --card: #252522; --ink: #F1F1EC; --muted: #A2A299; --line: #3A3A35;
  --panel: #1E464B; --panel-ink: #EEF4F3; --panel-muted: #9DBDBA;
  --lav: #6FAEE8; --lav-soft: #1F3247; --green: #7CC795; --green-soft: #213729;
  --coral: #F2817B; --coral-soft: #452729; --orange: #F2A766; --orange-soft: #43311F;
  --head: #111110; --head-ink: #F1F1EC; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #1B1B19; --card: #252522; --ink: #F1F1EC; --muted: #A2A299; --line: #3A3A35;
  --panel: #1E464B; --panel-ink: #EEF4F3; --panel-muted: #9DBDBA;
  --lav: #6FAEE8; --lav-soft: #1F3247; --green: #7CC795; --green-soft: #213729;
  --coral: #F2817B; --coral-soft: #452729; --orange: #F2A766; --orange-soft: #43311F;
  --head: #111110; --head-ink: #F1F1EC; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--head); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--lav); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--head); color: var(--head-ink);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 12px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand h1 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 26px; letter-spacing: .2px; }
.brand h1 i { color: var(--lav); font-style: italic; }
.brand .sync { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
.datebar { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.datebar .label { flex: 1; min-width: 0; text-align: center; font-weight: 700; }
.datebar .label small { display: block; font-weight: 500; font-size: 12px; opacity: .7; }
.iconbtn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--head-ink) 25%, transparent); background: transparent; display: grid; place-items: center; }
.pill { border: 1px solid color-mix(in srgb, var(--head-ink) 25%, transparent); background: transparent; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.datepick { position: relative; }
.datepick input { position: absolute; inset: 0; opacity: 0; width: 100%; }

main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px calc(96px + env(safe-area-inset-bottom, 0px)); max-width: 720px; margin: 0 auto; display: grid; gap: 14px; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--card); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs a { display: grid; justify-items: center; gap: 2px; padding: 9px 0 10px; color: var(--muted); text-decoration: none; font-size: 12px; font-weight: 700; }
nav.tabs a svg { width: 22px; height: 22px; }
nav.tabs a[aria-current="page"] { color: var(--ink); }
nav.tabs a[aria-current="page"] svg { color: var(--lav); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0; }
h2.title { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 28px; line-height: 1.05; text-wrap: balance; }
h3.sub { margin: 0; font-size: 15px; font-weight: 800; }
.vhead { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
.vhead > div:first-child { flex: 1; min-width: 0; }
.yrsw { display: inline-flex; align-items: center; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.yrsw button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: transparent; color: var(--ink); font-size: 18px; line-height: 1; }
.yrsw button:disabled { opacity: .3; }
.yrsw b { min-width: 46px; text-align: center; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spacer { flex: 1; }

/* score panel */
.panel { background: var(--panel); color: var(--panel-ink); border-radius: var(--r-lg); padding: 18px; display: grid; gap: 12px; }
.panel .big { font-family: var(--serif); font-size: 56px; line-height: .9; }
.panel .big small { font-size: 26px; color: var(--panel-muted); }
.panel .meta { color: var(--panel-muted); font-size: 13px; font-weight: 600; }
.bar { position: relative; height: 10px; border-radius: 99px; background: color-mix(in srgb, var(--panel-ink) 18%, transparent); overflow: visible; }
.bar > span { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--panel-ink); transition: width .25s; }
.bar > i { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--orange); border-radius: 2px; }
.badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 800; }
.badge.hit { background: var(--orange); color: #282825; }
.badge.miss { background: color-mix(in srgb, var(--panel-ink) 16%, transparent); color: var(--panel-ink); }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; padding: 3px; border-radius: 999px; background: color-mix(in srgb, var(--panel-ink) 14%, transparent); }
.seg button { border: 0; border-radius: 999px; padding: 8px 4px; background: transparent; color: var(--panel-ink); font-weight: 800; font-size: 13px; min-height: 36px; }
.seg button[aria-checked="true"] { background: var(--panel-ink); color: var(--panel); }
.seg button[data-v="poker"][aria-checked="true"] { background: var(--orange); color: #282825; }
.seg.light { background: var(--card); border: 1px solid var(--line); }
.seg.light button { color: var(--ink); }
.seg.light button[aria-checked="true"] { background: var(--ink); color: var(--paper); }
.seg.light button[data-v="poker"][aria-checked="true"] { background: var(--orange); color: #282825; }
.daychips { display: flex; gap: 6px; flex-wrap: wrap; }
.daychips button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; color: var(--muted); }
.daychips button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.daychips button:disabled { opacity: 1; cursor: default; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; }
.switch input { appearance: none; width: 42px; height: 24px; border-radius: 99px; background: color-mix(in srgb, var(--panel-ink) 22%, transparent); position: relative; margin: 0; transition: background .2s; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--panel-ink); transition: transform .2s; }
.switch input:checked { background: var(--orange); }
.switch input:checked::after { transform: translateX(18px); }

/* habits */
.habits { display: grid; gap: 8px; }
.habit { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--card); text-align: left; width: 100%; min-height: 58px; }
.habit .tick { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; transition: all .15s; }
.habit .tick svg { width: 16px; height: 16px; opacity: 0; }
.habit .name { font-weight: 700; min-width: 0; }
.habit .name small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.habit .pts { font-size: 12px; font-weight: 800; color: var(--muted); }
.habit.done { background: var(--green-soft); border-color: transparent; }
.habit.done .tick { background: var(--green); border-color: var(--green); color: var(--card); }
.habit.done .tick svg { opacity: 1; }
.habit.slip { background: var(--coral-soft); border-color: transparent; }
.habit.slip .tick { background: var(--coral); border-color: var(--coral); color: var(--card); }
.habit.slip .tick svg { opacity: 1; }
.habit.off { opacity: .45; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; background: var(--card); }
.stepper button { width: 34px; height: 34px; border: 0; background: transparent; font-size: 18px; font-weight: 700; }
.stepper input { width: 40px; border: 0; background: transparent; text-align: center; font-weight: 800; padding: 0; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

/* sections */
details.sec { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); }
details.sec > summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 14px 16px; cursor: pointer; }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary .t { font-weight: 800; }
details.sec > summary .s { margin-left: auto; color: var(--muted); font-size: 13px; font-weight: 600; text-align: right; }
details.sec > summary .chev { transition: transform .2s; color: var(--muted); }
details.sec[open] > summary .chev { transform: rotate(90deg); }
details.sec .body { padding: 0 16px 16px; display: grid; gap: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label, .lbl { font-size: 12px; font-weight: 700; color: var(--muted); }
.field input, .field select, textarea { width: 100%; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--paper); padding: 9px 10px; min-width: 0; }
textarea { min-height: 96px; resize: vertical; }
.calc { font-size: 13px; color: var(--muted); font-weight: 600; }
.calc b { color: var(--ink); }
.subhead { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--lav); margin: 4px 0 -4px; }
.chips { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
.chips button { height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); font-weight: 800; font-size: 13px; padding: 0; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.rating { display: grid; gap: 6px; }
.rating .row { justify-content: space-between; }

/* stats */
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 14px; display: grid; gap: 2px; }
.kpi .v { font-family: var(--serif); font-size: 34px; line-height: 1; }
.kpi .k { font-size: 12px; font-weight: 700; color: var(--muted); }
.kpi.accent { background: var(--panel); border-color: var(--panel); color: var(--panel-ink); }
.kpi.accent .k { color: var(--panel-muted); }
.hrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.hrow:first-of-type { border-top: 0; }
.hrow .nm { font-weight: 700; min-width: 0; }
.hrow .wk { font-size: 12px; font-weight: 800; border-radius: 999px; padding: 3px 9px; background: var(--paper); align-self: start; }
.hrow .wk.met { background: var(--green-soft); color: var(--green); }
.hrow .facts { grid-column: 1 / -1; display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); font-weight: 600; }
.hrow .facts b { color: var(--ink); }
.meter { grid-column: 1 / -1; height: 6px; border-radius: 99px; background: var(--paper); overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--lav); border-radius: 99px; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: right; font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; padding: 6px 6px; }
table.t th:first-child, table.t td:first-child { text-align: left; }
table.t td { text-align: right; padding: 8px 6px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
table.t tr.total td { font-weight: 800; }
.scroll-x { overflow-x: auto; }
.pos { color: var(--green); } .neg { color: var(--coral); }
.better { background: var(--green-soft); border-radius: 6px; }
.pay { display: grid; gap: 6px; padding: 12px 0; border-top: 1px solid var(--line); }
.pay .nm { font-weight: 700; min-width: 0; }
.pay .facts { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); font-weight: 600; }
.pay .facts b { color: var(--ink); }
.pay .facts b.pos { color: var(--green); } .pay .facts b.neg { color: var(--coral); }
.div-bar { position: relative; height: 8px; border-radius: 99px; background: var(--paper); }
.div-bar i { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--muted); border-radius: 2px; }
.div-bar span { position: absolute; top: 0; bottom: 0; border-radius: 99px; }
.div-bar span.up { background: var(--green); }
.div-bar span.down { background: var(--coral); }
svg.chart { width: 100%; height: auto; display: block; }
svg.chart text { fill: var(--muted); font-size: 10px; font-family: var(--sans); }

/* year */
.months { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(132px, 100%), 1fr)); gap: 14px 12px; }
.month h4 { margin: 0 0 6px; font-family: var(--serif); font-weight: 400; font-size: 20px; }
.month .avg { font-family: var(--sans); font-size: 12px; color: var(--muted); font-weight: 700; margin-left: 6px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.cal .dow { font-size: 9px; text-align: center; color: var(--muted); font-weight: 800; }
.cal button { aspect-ratio: 1; max-width: 100%; border: 0; border-radius: 5px; background: var(--paper); padding: 0; font-size: 9px; font-weight: 700; color: var(--muted); }
.cal button.today { outline: 2px solid var(--ink); outline-offset: -2px; }
.cal button.offd { background: repeating-linear-gradient(45deg, var(--line) 0 3px, transparent 3px 6px); }
.cal button.pkd { position: relative; }
.cal button.pkd::after { content: ""; position: absolute; top: 2px; right: 2px; width: 5px; height: 5px; border-radius: 50%; background: var(--orange); }
.legend .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--orange); display: inline-block; margin-left: 10px; }
.legend { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 600; flex-wrap: wrap; }
.legend span.sw { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }

/* setup */
.hedit { border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px; display: grid; gap: 10px; background: var(--paper); }
.hedit .row button { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 700; }
.btn { border: 0; border-radius: 999px; padding: 12px 18px; font-weight: 800; background: var(--ink); color: var(--paper); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.lav { background: var(--lav); color: var(--paper); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font-size: 13px; font-weight: 700; z-index: 20; max-width: calc(100% - 32px); }
.empty { text-align: center; padding: 28px 16px; display: grid; gap: 10px; justify-items: center; }
.empty .title { font-size: 30px; }
.note { font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (min-width: 640px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
</style>

<header class="top">
  <div class="brand"><h1>Habit <i>Tracker</i></h1><span class="sync" id="sync">Connecting…</span></div>
  <div class="datebar" id="datebar">
    <button class="iconbtn" id="prevDay" aria-label="Previous day"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <label class="label datepick" for="datePick"><span id="dateLabel">Today</span><small id="dateSub"> </small><input type="date" id="datePick" aria-label="Pick a date"></label>
    <button class="iconbtn" id="nextDay" aria-label="Next day"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
    <button class="pill" id="goToday">Today</button>
  </div>
</header>

<main id="view"><div class="card empty"><h2 class="title">Loading your tracker</h2><p class="note">Your habits, points and poker log appear here once they load.</p></div></main>

<nav class="tabs" aria-label="Sections">
  <a href="#today" data-v="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>Today</a>
  <a href="#stats" data-v="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-7"/></svg>Stats</a>
  <a href="#year" data-v="year"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg>Year</a>
  <a href="#setup" data-v="setup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Setup</a>
</nav>

<script>
(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(String(c)));
  return n;
};
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const CROSS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const CHEV = '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>';

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2, "0");

const parseKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d, 12); };

const diffDays = (a, b) => Math.round((parseKey(b) - parseKey(a)) / 86400000);
const todayKey = () => keyOf(new Date());
const fmtLong = k => parseKey(k).toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
const fmtShort = k => parseKey(k).toLocaleDateString(undefined, { month: "short", day: "numeric" });

/* ---------- number formatting ---------- */
const n0 = v => v == null || !isFinite(v) ? "–" : Math.round(v).toLocaleString();
const n1 = v => v == null || !isFinite(v) ? "–" : (Math.round(v * 10) / 10).toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 });

const num = v => (v === "" || v == null || isNaN(+v)) ? null : +v;

/* ---------- state ---------- */
const S = { db: null, cfg: null, days: new Map(), date: todayKey(), view: "today", loaded: { cfg: false, days: false }, dirty: new Set(), writing: new Map(), timers: new Map(), downloads: null, readOnly: false };

const DEFAULT_TARGETS = { start: "2027-01-01", target: 13, calories: 2000, sleepGoal: 7.5, goalWeight: null, profitGoal: 50000 };
const cfg = () => S.cfg || { ...DEFAULT_TARGETS, habits: [] };
const habits = () => (cfg().habits || []).filter(h => h && h.name);
const possible = () => habits().reduce((a, h) => a + (+h.pts || 0), 0);
/* Day types: Non-poker (default), Poker (day.type = "poker"), Day off (day.off). Habits say which days they count on. */
const dayType = day => day && day.off ? "off" : day && day.type === "poker" ? "poker" : "np";
const isPokerDay = day => dayType(day) === "poker";
/* Which day types a habit counts on. Older setups stored h.on ("both" | "np" | "poker"). */
const habitDays = h => h.days ? { np: !!h.days.np, poker: !!h.days.poker, off: !!h.days.off } : { np: h.on !== "poker", poker: h.on !== "np", off: false };

const habitsFor = day => habits().filter(h => appliesTo(h, day));
const possibleFor = day => habitsFor(day).reduce((a, h) => a + (+h.pts || 0), 0);
const TARGET_KEY = { np: "target", poker: "pokerTarget", off: "offTarget" };
const targetFor = day => { const c = cfg(), v = c[TARGET_KEY[dayType(day)]]; return v != null && v !== "" ? +v : dayType(day) === "off" ? 0 : (+c.target || 0); };
const DAY_LABEL = { np: "Non-poker", poker: "Poker", off: "Day off" };
const dayNoun = t => t === "off" ? "days off" : `${DAY_LABEL[t]} days`;
const daysLabel = h => { const d = habitDays(h), on = Object.keys(DAY_LABEL).filter(k => d[k]); return on.length === 3 ? "" : on.length ? on.map(k => DAY_LABEL[k]).join(" + ") + " only" : "No day type"; };

/* ---------- day logic (mirrors the Excel workbook) ---------- */
function hasData(o) {
  if (o == null) return false;
  if (typeof o === "boolean") return o;
  if (typeof o === "number") return true;
  if (typeof o === "string") return o.trim() !== "";
  if (typeof o === "object") return Object.values(o).some(hasData);
  return false;
}
const getDay = k => S.days.get(k) || {};
const isLogged = day => hasData(day);
function isDone(h, day) {
  const v = day.h ? day.h[h.id] : undefined;
  if (h.type === "Minutes") return typeof v === "number" && v >= (+h.min || 0) && v > 0;
  if (h.type === "Avoid") return isLogged(day) && !v;
  return !!v;
}
function dayPoints(day) {
  if (!isLogged(day) || day.off) return null;
  return habitsFor(day).reduce((a, h) => a + (isDone(h, day) ? (+h.pts || 0) : 0), 0);
}
const g = (o, a, b) => (o && o[a] && typeof o[a][b] === "number") ? o[a][b] : null;
function pokerOf(day) {
  const on = { hands: g(day, "on", "hands"), bb: g(day, "on", "bb"), won: g(day, "on", "won") };
  const lv = { hrs: g(day, "lv", "hrs"), bb: g(day, "lv", "bb"), won: g(day, "lv", "won") };
  const mt = { hrs: g(day, "mt", "hrs"), buy: g(day, "mt", "buy"), cash: g(day, "mt", "cash") };
  const onBB = on.won != null && on.bb > 0 ? on.won / on.bb : null;
  const lvBB = lv.won != null && lv.bb > 0 ? lv.won / lv.bb : null;
  const mtNet = (mt.buy != null || mt.cash != null) ? (mt.cash || 0) - (mt.buy || 0) : null;
  const any = on.won != null || lv.won != null || mtNet != null;
  return { on, lv, mt, onBB, lvBB, mtNet, net: any ? (on.won || 0) + (lv.won || 0) + (mtNet || 0) : null,
    bb100: onBB != null && on.hands > 0 ? onBB / on.hands * 100 : null, bbhr: lvBB != null && lv.hrs > 0 ? lvBB / lv.hrs : null };
}
function foodOf(day) {
  const f = day.fd || {}; const vals = ["b", "l", "d", "o"].map(k => typeof f[k] === "number" ? f[k] : null);
  if (vals.every(v => v == null)) return null;
  return vals.reduce((a, v) => a + (v || 0), 0);
}

/* ---------- years ---------- */
function yearBounds() {
  const c = cfg(), sy = +(c.start || DEFAULT_TARGETS.start).slice(0, 4), ty = +todayKey().slice(0, 4);
  let lo = Math.min(sy, ty), hi = Math.max(sy, ty);
  for (const [k, d] of S.days) if (isLogged(d)) { const y = +k.slice(0, 4); if (y < lo) lo = y; if (y > hi) hi = y; }
  return [lo, hi];
}
function curYear() {
  const [lo, hi] = yearBounds();
  if (S.year == null) S.year = +todayKey().slice(0, 4);
  return Math.min(hi, Math.max(lo, S.year));
}
function yearSwitch() {
  const [lo, hi] = yearBounds(), y = curYear();
  const go = d => { S.year = y + d; render(); window.scrollTo(0, 0); };
  return el("div", { class: "yrsw", role: "group", "aria-label": "Year" },
    el("button", { type: "button", "aria-label": "Previous year", disabled: y <= lo ? "" : null, text: "‹", onclick: () => go(-1) }),
    el("b", { text: String(y) }),
    el("button", { type: "button", "aria-label": "Next year", disabled: y >= hi ? "" : null, text: "›", onclick: () => go(1) }));
}

const DECAY = Math.pow(0.2, 1 / 30);
function computeStats(Y = curYear()) {
  const c = cfg(), hs = habits(), cs = c.start || DEFAULT_TARGETS.start, y0 = `${Y}-01-01`, end = `${Y}-12-31`;
  const start = cs > y0 && cs <= end ? cs : y0;
  let asof = start;
  for (const [k, d] of S.days) if (k >= start && k <= end && k > asof && isLogged(d)) asof = k;
  const N = Math.max(0, diffDays(start, asof)) + 1;
  const per = hs.map(h => ({ h, done: 0, days: 0, n30: 0, streak: 0, best: 0, strength: 0, mins: 0, d7: 0, d30: 0, wk: 0,
    net: { y: [], n: [] }, ov: { y: [], n: [] }, fo: { y: [], n: [] } }));
  const weekStart = addDays(start, 7 * Math.floor(diffDays(start, asof) / 7));
  let logged = 0, off = 0, on = 0, hit = 0, tStreak = 0, tBest = 0, on7 = 0, on30 = 0, pts = [], pcts = [], pts7 = [];
  const series = [];
  const P = { onN: 0, hands: 0, onWon: 0, onBB: 0, lvN: 0, lvHrs: 0, lvWon: 0, lvBB: 0, mtN: 0, mtHrs: 0, mtBuy: 0, mtNet: 0, days: 0, net: 0 };
  const ins = { hit: {}, miss: {} };
  const insKeys = ["overall", "focus", "slp", "net", "study"];
  for (const k of insKeys) { ins.hit[k] = []; ins.miss[k] = []; }
  const sleep = { hrs: [], score: [], ready: [], hrv: [], rhr: [] }, ratings = {}, wts = [], cals = [], study = [];
  for (const r of ["focus", "energy", "disc", "overall", "stress", "mood"]) ratings[r] = [];
  let cum = 0;
  const month = {};
  for (let i = 0; i < N; i++) {
    const k = addDays(start, i), day = getDay(k), lg = isLogged(day), isOff = lg && !!day.off, isOn = lg && !isOff;
    const in7 = diffDays(k, asof) < 7, in30 = diffDays(k, asof) < 30, inWk = k >= weekStart;
    if (lg) logged++; if (isOff) off++; if (isOn) { on++; if (in7) on7++; if (in30) on30++; }
    const p = isOn ? dayPoints(day) : null, poss = possibleFor(day);
    const isHit = p != null && p >= targetFor(day);
    if (p != null) { pts.push(p); pcts.push(poss ? p / poss : 0); if (in7) pts7.push(p); }
    if (isHit) hit++;
    tStreak = isHit ? tStreak + 1 : (isOff ? tStreak : 0); tBest = Math.max(tBest, tStreak);
    const pkDay = pokerOf(day), rDay = day.r || {};
    per.forEach(x => {
      const ap = lg && appliesTo(x.h, day), skip = lg && !ap;
      const dn = ap && isDone(x.h, day);
      if (ap) { x.days++; if (in30) x.n30++; }
      if (dn) { x.done++; if (in7) x.d7++; if (in30) x.d30++; }
      if (ap) {
        const b = dn ? "y" : "n";
        if (pkDay.net != null) x.net[b].push(pkDay.net);
        if (typeof rDay.overall === "number") x.ov[b].push(rDay.overall);
        if (typeof rDay.focus === "number") x.fo[b].push(rDay.focus);
      }
      if (dn && inWk) x.wk++;
      x.streak = dn ? x.streak + 1 : (skip ? x.streak : 0); x.best = Math.max(x.best, x.streak);
      x.strength = skip ? x.strength : x.strength * DECAY + (dn ? 1 - DECAY : 0);
      if (x.h.type === "Minutes" && day.h && typeof day.h[x.h.id] === "number") x.mins += day.h[x.h.id];
    });
    const pk = pokerOf(day);
    if (pk.on.won != null) { P.onN++; P.onWon += pk.on.won; P.hands += pk.on.hands || 0; P.onBB += pk.onBB || 0; }
    if (pk.lv.won != null) { P.lvN++; P.lvWon += pk.lv.won; P.lvHrs += pk.lv.hrs || 0; P.lvBB += pk.lvBB || 0; }
    if (pk.mtNet != null) { P.mtN++; P.mtNet += pk.mtNet; P.mtHrs += pk.mt.hrs || 0; P.mtBuy += pk.mt.buy || 0; }
    if (pk.net != null) { P.days++; P.net += pk.net; }
    cum += pk.net || 0; series.push({ k, cum, pct: p != null && poss ? p / poss : null, off: isOff, logged: lg });
    const rv = day.r || {};
    for (const r in ratings) if (typeof rv[r] === "number") ratings[r].push(rv[r]);
    for (const s in sleep) { const v = g(day, "sl", s); if (v != null) sleep[s].push(v); }
    if (typeof day.wt === "number") wts.push(day.wt);
    const fc = foodOf(day); if (fc != null) cals.push(fc);
    if (typeof day.study === "number") study.push(day.study);
    if (isOn) {
      const bucket = isHit ? ins.hit : ins.miss;
      const vals = { overall: rv.overall, focus: rv.focus, slp: g(day, "sl", "hrs"), net: pk.net, study: day.study };
      for (const kk of insKeys) if (typeof vals[kk] === "number") bucket[kk].push(vals[kk]);
    }
    const mk = k.slice(0, 7); month[mk] = month[mk] || { pcts: [], net: 0 };
    if (p != null && poss) month[mk].pcts.push(p / poss); month[mk].net += pk.net || 0;
  }
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  return { Y, start, asof, N, logged, off, on, hit, tStreak, tBest, on7, on30, weekStart, per, P, series, month,
    avgPts: avg(pts), avgPct: avg(pcts), avg7: avg(pts7), hitRate: on ? hit / on : null,
    ins, avg, ratings, sleep, wts, cals, study, sumStudy: study.reduce((a, b) => a + b, 0) };
}

/* ---------- persistence ---------- */
function toast(msg) {
  const t = el("div", { class: "toast", role: "status", text: msg });
  document.body.append(t); setTimeout(() => t.remove(), 2400);
}
function setSync(text) { $("#sync").textContent = text; }
function scheduleSave(k) {
  if (!S.db || S.readOnly) return;
  S.dirty.add(k); setSync("Saving…");
  clearTimeout(S.timers.get(k));
  S.timers.set(k, setTimeout(() => flush(k), 650));
}
async function flush(k) {
  if (S.writing.get(k)) { S.timers.set(k, setTimeout(() => flush(k), 300)); return; }
  S.timers.delete(k);
  S.writing.set(k, true);
  const body = JSON.parse(JSON.stringify(getDay(k)));
  try { await S.db.doc("days/" + k).set(body); setSync("Saved on phone"); }
  catch (e) {
    if (e && e.code === "invalid_argument") { S.readOnly = true; setSync("Read-only"); toast("This tracker is read-only for you. Only its owner can log days."); }
    else if (e && e.code === "quota_exceeded") toast("Storage is full. Delete old days to keep logging.");
    else { setSync("Offline"); toast("Couldn't save. Check your connection; your change is kept on this screen."); }
  } finally {
    S.writing.set(k, false);
    if (!S.timers.has(k)) S.dirty.delete(k);
  }
}
function mutate(fn) {
  const k = S.date; const day = JSON.parse(JSON.stringify(getDay(k)));
  fn(day); S.days.set(k, day); scheduleSave(k); refreshToday();
}

/* ---------- views ---------- */
const view = () => $("#view");

  document.querySelectorAll("nav.tabs a").forEach(a => a.setAttribute("aria-current", a.dataset.v === S.view ? "page" : "false"));
  $("#datebar").hidden = S.view !== "today";

}
function render() {

  if (!S.loaded.cfg) return;
  if (S.view === "today") renderToday();
  else if (S.view === "stats") renderStats();
  else if (S.view === "year") renderYear();

}

}

    const id = "s-" + key, inp = el("input", { id, type, step, value: c[key] == null ? "" : c[key] });
    inp.addEventListener("input", () => { c[key] = type === "number" ? num(inp.value) : inp.value; });
    return el("div", { class: "field" }, el("label", { for: id, text: label }), inp);
  };
  root.push(el("section", { class: "card" }, el("h3", { class: "sub", text: "General" }),
    el("div", { class: "grid2" }, f("Tracking since", "start", "date"), f("Calorie target", "calories", "number", "50"),
      f("Sleep goal (hours)", "sleepGoal", "number", "0.25"), f("Goal weight", "goalWeight", "number", "0.1"), f("Poker profit goal $", "profitGoal", "number", "100"))));

  // Habits keep a days map; convert older "on" values once so every tab edits the same objects.
  c.habits.forEach(h => { h.days = habitDays(h); delete h.on; });
  const TYPES = ["np", "poker", "off"];
  if (!TYPES.includes(S.setupTab)) S.setupTab = "np";
  const tabs = el("div", { class: "seg light", role: "tablist", "aria-label": "Day type" });
  const pane = el("div", { style: "display:grid;gap:14px" });
  const drawTabs = () => tabs.replaceChildren(...TYPES.map(t => el("button", { type: "button", role: "tab", "data-v": t, "aria-selected": String(S.setupTab === t), "aria-checked": String(S.setupTab === t), text: DAY_LABEL[t],
    onclick: () => { S.setupTab = t; drawTabs(); drawPane(); } })));
  const drawPane = () => {
    const t = S.setupTab, mine = c.habits.filter(h => h.days[t]), others = c.habits.filter(h => !h.days[t]);
    const tk = TARGET_KEY[t];
    const total = el("p", { class: "calc" });
    const drawTotal = () => { const sum = c.habits.filter(h => h.days[t] && (h.name || "").trim()).reduce((a, h) => a + (+h.pts || 0), 0); total.innerHTML = `Points possible on ${dayNoun(t)}: <b>${sum}</b>`; };
    const list = el("div", { style: "display:grid;gap:10px" });
    mine.forEach((h, n) => {
      const id = "h-" + h.id;
      const inp = (label, key, attrs = {}) => { const x = el("input", { id: `${id}-${key}`, value: h[key] == null ? "" : h[key], ...attrs });
        x.addEventListener("input", () => { h[key] = attrs.type === "number" ? num(x.value) : x.value; drawTotal(); });
        return el("div", { class: "field" }, el("label", { for: `${id}-${key}`, text: label }), x); };
      const sel = el("select", { id: `${id}-type` }, ...["Check", "Minutes", "Avoid"].map(v => el("option", { value: v, selected: h.type === v, text: v })));
      sel.addEventListener("change", () => { h.type = sel.value; drawPane(); });
      const swap = dir => { const a = c.habits.indexOf(h), b = c.habits.indexOf(mine[n + dir]); [c.habits[a], c.habits[b]] = [c.habits[b], c.habits[a]]; drawPane(); };
      list.append(el("div", { class: "hedit" },
        inp("Habit", "name"),
        el("div", { class: "grid3" }, inp("Category", "cat"), inp("Points", "pts", { type: "number", step: "1", inputmode: "numeric" }),
          el("div", { class: "field" }, el("label", { for: `${id}-type`, text: "Type" }), sel)),
        el("div", { class: "grid2" },
          h.type === "Minutes" ? inp("Min. minutes", "min", { type: "number", step: "1", inputmode: "numeric" }) : el("p", { class: "note", text: h.type === "Avoid" ? "Counts as done unless you mark a slip." : "Done when you tap it." }),
          inp("Times / week", "tpw", { type: "number", step: "1", min: "1", max: "7", inputmode: "numeric" })),
        el("div", { class: "field" }, el("span", { class: "lbl", text: "Counts on" }),
          el("div", { class: "daychips" }, ...TYPES.map(k => el("button", { type: "button", "aria-pressed": String(!!h.days[k]), disabled: k === t, text: DAY_LABEL[k],
            onclick: () => { h.days[k] = !h.days[k]; drawPane(); } })))),
        el("div", { class: "row" },
          el("button", { type: "button", disabled: n === 0, onclick: () => swap(-1), text: "Move up" }),
          el("button", { type: "button", disabled: n === mine.length - 1, onclick: () => swap(1), text: "Move down" }),
          el("span", { class: "spacer" }),
          el("button", { type: "button", onclick: () => { h.days[t] = false; drawPane(); }, text: "Remove from this day" }),
          el("button", { type: "button", style: "color:var(--coral)", onclick: () => { if (confirm(`Delete "${h.name || "this habit"}" from every day type? Past days keep their record.`)) { c.habits.splice(c.habits.indexOf(h), 1); drawPane(); } }, text: "Delete" }))));
    });
    if (!mine.length) list.append(el("p", { class: "note", text: t === "off" ? "No habits count on days off, so they're rest days. Add one below if you want to track something on days off." : `No habits count on ${dayNoun(t)} yet.` }));
    drawTotal();
    const card = el("section", { class: "card" },
      el("h3", { class: "sub", text: t === "off" ? "Days off" : dayNoun(t) }),
      el("div", { class: "grid2" }, f(t === "off" ? "Day off target" : `${DAY_LABEL[t]} day target`, tk, "number", "1")),
      el("p", { class: "note", text: "Check: tap when done. Minutes: done at the minimum. Avoid: a habit to quit; mark only slips." }),
      list, total,
      el("button", { type: "button", class: "btn ghost", onclick: () => { c.habits.push({ id: "h" + Date.now().toString(36), name: "", cat: "", pts: 1, type: "Check", min: null, tpw: 7, days: { np: false, poker: false, off: false, [t]: true } }); drawPane(); const ins = pane.querySelectorAll(".hedit"); if (ins.length) ins[ins.length - 1].querySelector("input").focus(); }, text: `+ New habit for ${dayNoun(t)}` }));
    const rest = others.filter(h => (h.name || "").trim());
    const other = rest.length ? el("section", { class: "card" },
      el("h3", { class: "sub", text: `Not on ${dayNoun(t)}` }),
      el("p", { class: "note", text: "Your other habits. Add one to count it on this day type too." }),
      ...rest.map(h => el("div", { class: "row", style: "border-top:1px solid var(--line);padding-top:8px" },
        el("span", { style: "font-weight:700;flex:1;min-width:0", text: h.name }), el("span", { class: "note", text: `${+h.pts || 0} pt${+h.pts === 1 ? "" : "s"}` }),
        el("button", { type: "button", class: "btn ghost", style: "padding:6px 12px", onclick: () => { h.days[t] = true; drawPane(); }, text: "+ Add" })))) : null;
    pane.replaceChildren(card, ...(other ? [other] : []));
  };
  drawTabs(); drawPane();
  root.push(el("div", { style: "display:grid;gap:8px" }, el("h3", { class: "sub", text: "Habits & targets by day type" }), tabs), pane);

  root.push(el("div", { class: "row" },
    el("button", { type: "button", class: "btn", id: "saveSetup", onclick: async () => {
      if (!S.db || S.readOnly) return toast("Only the owner can change setup.");
      const clean = { ...c, habits: c.habits.filter(h => (h.name || "").trim()).map(h => ({ ...h, name: h.name.trim(), pts: +h.pts || 0, tpw: Math.min(7, Math.max(1, +h.tpw || 7)) })) };
      try { await S.db.doc("config/main").set(clean); toast("Setup saved"); }
      catch (e) { toast(e && e.code === "invalid_argument" ? "Only the owner can change setup." : "Couldn't save setup. Check your connection and try again."); }
    }, text: "Save setup" }),
    el("button", { type: "button", class: "btn ghost", onclick: () => { render(); toast("Changes discarded"); }, text: "Discard" })));

  root.push(el("section", { class: "card" }, el("h3", { class: "sub", text: "Export" }),
    el("p", { class: "note", text: "Download every logged day as a CSV file you can open in Excel or Google Sheets." }),
    el("button", { type: "button", class: "btn lav", onclick: exportCsv, text: "Download CSV" })));
  root.push(el("section", { class: "card" }, el("h3", { class: "sub", text: "Backup" }),
    el("p", { class: "note", text: "Your data is saved only on this phone. Download a backup every week or two, and always before changing phones or clearing Chrome's data. Restore replaces everything on this phone with the backup." }),
    el("div", { class: "row", style: "flex-wrap:wrap;gap:8px" },
      el("button", { type: "button", class: "btn", onclick: () => { window.__htBackup(); toast("Backup downloaded"); }, text: "Download backup" }),
      el("label", { class: "btn ghost", style: "display:inline-flex;align-items:center;cursor:pointer" }, "Restore backup",
        el("input", { type: "file", accept: ".json,application/json", hidden: true, onchange: async e => {
          const f = e.target.files[0]; if (!f) return;
          if (!confirm("Replace everything on this phone with this backup?")) { e.target.value = ""; return; }
          try { const n = await window.__htRestore(f); toast(`Restored ${n} items`); setTimeout(() => location.reload(), 700); }
          catch (err) { toast("That file isn't a Habit Tracker backup."); }
          e.target.value = "";
        } })))));
  view().replaceChildren(...root);
}
async function exportCsv() {
  if (!S.downloads) return toast("Downloads aren't available here. Open the tracker on claude.ai in a browser.");
  const hs = habits(), keys = [...S.days.keys()].sort();
  const head = ["date", "day_type", ...hs.map(h => h.name), "points", "focus", "energy", "discipline", "overall", "stress", "mood", "study_hrs",
    "online_hands", "online_bb", "online_won", "live_hrs", "live_bb", "live_won", "mtt_hrs", "mtt_buyins", "mtt_cashes", "poker_net",
    "sleep_hrs", "sleep_score", "readiness", "hrv", "resting_hr", "weight", "cal_breakfast", "cal_lunch", "cal_dinner", "cal_other", "notes"];
  const esc = v => v == null ? "" : /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v);
  const rows = [head.map(esc).join(",")];
  for (const k of keys) {
    const d = getDay(k); if (!isLogged(d)) continue;
    const pk = pokerOf(d), r = d.r || {}, v = (o, a) => o && typeof o[a] === "number" ? o[a] : "";
    rows.push([k, { off: "Day off", poker: "Poker", np: "Non-poker" }[dayType(d)], ...hs.map(h => { const x = d.h ? d.h[h.id] : undefined; return h.type === "Minutes" ? (typeof x === "number" ? x : "") : h.type === "Avoid" ? (x ? "slip" : "") : (x ? "x" : ""); }),
      dayPoints(d) ?? "", v(r, "focus"), v(r, "energy"), v(r, "disc"), v(r, "overall"), v(r, "stress"), v(r, "mood"), typeof d.study === "number" ? d.study : "",
      v(d.on, "hands"), v(d.on, "bb"), v(d.on, "won"), v(d.lv, "hrs"), v(d.lv, "bb"), v(d.lv, "won"), v(d.mt, "hrs"), v(d.mt, "buy"), v(d.mt, "cash"), pk.net ?? "",
      v(d.sl, "hrs"), v(d.sl, "score"), v(d.sl, "ready"), v(d.sl, "hrv"), v(d.sl, "rhr"), typeof d.wt === "number" ? d.wt : "",
      v(d.fd, "b"), v(d.fd, "l"), v(d.fd, "d"), v(d.fd, "o"), d.note || ""].map(esc).join(","));
  }
  try { await S.downloads.save({ filename: "habit-tracker-export.csv", data: rows.join("\n") }); toast("Exported"); }
  catch (e) { if (!e || e.code !== "declined") toast("Couldn't export. Try again in a moment."); }
}

/* ---------- navigation ---------- */
$("#prevDay").addEventListener("click", () => { S.date = addDays(S.date, -1); renderToday(); });
$("#nextDay").addEventListener("click", () => { S.date = addDays(S.date, 1); renderToday(); });
$("#goToday").addEventListener("click", () => { S.date = todayKey(); renderToday(); });
$("#datePick").addEventListener("change", e => { if (e.target.value) { S.date = e.target.value; renderToday(); } });
window.addEventListener("hashchange", () => setView(location.hash.slice(1)));

/* ---------- boot ---------- */
async function boot() {
  setView(location.hash.slice(1) || "today");
  const claude = window.claude;
  if (!claude || !claude.use) { S.noDb = true; setSync("Offline"); renderNoDb(); return; }
  const [db, user, downloads] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("downloads")]);
  S.downloads = downloads;
  if (!db) { S.noDb = true; setSync("Not signed in"); renderNoDb(); return; }
  S.db = db;
  if (user) { const owner = await user.isOwner(); if (!owner) S.readOnly = true; }
  const timer = setTimeout(() => { if (!S.loaded.cfg) { setSync("Can't reach"); view().replaceChildren(el("div", { class: "card empty" }, el("h2", { class: "title", text: "Still connecting" }), el("p", { class: "note", text: "Your tracker can't be reached yet. Check your connection; it loads as soon as it's back." }))); } }, 10000);
  db.doc("config/main").onSnapshot(snap => {
    S.cfg = snap.exists ? snap.data() : null;
    if (!snap.metadata.fromCache) { S.loaded.cfg = true; clearTimeout(timer); setSync("On this phone"); }
    else S.loaded.cfg = S.loaded.cfg || !!S.cfg;
    if (S.view !== "setup" || !document.activeElement || !view().contains(document.activeElement)) render();
  }, () => { setSync("Error"); });
  db.collection("days").onSnapshot(snap => {
    let curChanged = false;
    for (const ch of snap.docChanges()) {
      const id = ch.doc.id; if (S.dirty.has(id) || S.writing.get(id)) continue;
      if (ch.type === "removed") S.days.delete(id); else S.days.set(id, ch.doc.data());
      if (id === S.date) curChanged = true;
    }
    S.loaded.days = true;
    if (S.view === "today") { if (curChanged && !(document.activeElement && view().contains(document.activeElement) && document.activeElement.matches("input,textarea"))) renderToday(); else refreshToday(); }
    else if (S.view !== "setup") render();
  }, () => { setSync("Error"); });
}
boot();
})();
